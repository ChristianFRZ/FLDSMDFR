# web en 03-gateway-discovery-balanceo: solo sirve el SPA compilado. La API la reparte el
# gateway (services/gateway), que también es quien envía aquí todo lo que no es /api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
