# Proxy mínimo de 02-separacion: un solo origen (puerto 8000 del host) para el navegador.
# Reparte por prefijo; no balancea ni descubre servicios (eso llega en 03-gateway-discovery-balanceo).

# DNS embebido de Docker. Con variables en proxy_pass el nombre se resuelve en cada petición:
# si un servicio está apagado, Nginx sigue arriba y responde 503 en lugar de no arrancar.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Subidas de canciones: 20 MB de audio + 1 MB de multipart (igual que UploadSizeGuard).
    client_max_body_size 21m;

    set $users    users-playlists:8000;
    set $catalog  catalog-streaming:8000;
    set $playback playback-metrics:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;

    # La API interna entre servicios nunca se expone al cliente.
    location /internal/ {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"No encontramos lo que buscas."}}';
    }

    # Salud del proxy (cada servicio tiene además su propio /api/health en la red interna).
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # playback-metrics: eventos, métricas e historial.
    location /api/playbacks { proxy_pass http://$playback; error_page 502 504 = @down; }
    location /api/metrics/  { proxy_pass http://$playback; error_page 502 504 = @down; }
    location /api/me/history { proxy_pass http://$playback; error_page 502 504 = @down; }

    # catalog-streaming: catálogo, streaming con Range y portadas. Sin buffer para el audio.
    location /api/songs {
        proxy_pass http://$catalog;
        proxy_buffering off;
        proxy_request_buffering off;
        error_page 502 504 = @down;
    }

    # users-playlists: auth, users, playlists, invites y el resto de /api/me/.
    location /api/ { proxy_pass http://$users; error_page 502 504 = @down; }

    # Servicio caído o inalcanzable: mismo formato de error que la API.
    location @down {
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable","message":"El servicio no está disponible. Intenta de nuevo en un momento."}}';
    }

    # SPA: archivos compilados; cualquier otra ruta la resuelve Vue Router.
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
