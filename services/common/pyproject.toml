[project]
name = "meloxo-common"
version = "0.1.0"
description = "Código compartido por los servicios de MELOXO"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy[asyncio]>=2.0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meloxo_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
