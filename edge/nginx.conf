# nginx de entrada de MELOXO: sirve la SPA y reparte /api/* entre los tres servicios por prefijo.
# Se usa la coincidencia más larga; los prefijos que terminan en "/" evitan que /api/composer
# capture /api/composer-requests. Los nombres se resuelven en cada petición con el DNS de Docker:
# nginx arranca aunque un servicio esté caído y lo recupera cuando vuelve.
# Sesión y rol: toda ruta pasa por auth_request a gateway-auth salvo las que llevan
# "auth_request off;". Una ruta nueva queda protegida por defecto.
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rol exigido por prefijo (PRD §12). La barra final evita que /api/composer-requests
    # cuente como /api/composer/. Vacío = basta con una sesión válida.
    map $uri $required_roles {
        default "";
        ~^/api/admin/ admin;
        ~^/api/composer/ "composer,admin";
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;

        # Identidad que fija el gateway. Con auth_request off las variables quedan vacías y nginx no
        # envía la cabecera: la que mande el cliente nunca llega al servicio.
        auth_request /_auth;
        # La subpetición comparte variables con la principal pero tiene su propio $uri (/_auth):
        # el rol se calcula aquí, con el $uri ya normalizado de la petición principal.
        if ($uri != /_auth) {
            set $auth_required_roles $required_roles;
        }
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;

        # Variable propia: una subpetición comparte las variables con la petición principal y un
        # "set $upstream" aquí haría que la petición protegida terminara en gateway-auth.
        location = /_auth {
            internal;
            auth_request off;
            set $auth_upstream http://gateway-auth:8004;
            proxy_pass $auth_upstream/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Required-Roles $auth_required_roles;
            # La identidad que mande el cliente no llega a gateway-auth.
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        # Un servicio caído (o sin DNS) responde con el mismo JSON de error que la API.
        # auth_request convierte un gateway-auth caído en 500: también es upstream_unavailable.
        error_page 502 503 504 /errors/upstream_unavailable.json;
        error_page 500 =503 /errors/upstream_unavailable.json;
        error_page 401 /errors/unauthorized.json;
        error_page 403 /errors/forbidden.json;
        location = /errors/upstream_unavailable.json {
            internal;
            auth_request off;
            alias /etc/nginx/errors/upstream_unavailable.json;
            default_type application/json;
        }
        location = /errors/unauthorized.json {
            internal;
            auth_request off;
            alias /etc/nginx/errors/unauthorized.json;
            default_type application/json;
        }
        location = /errors/forbidden.json {
            internal;
            auth_request off;
            alias /etc/nginx/errors/forbidden.json;
            default_type application/json;
        }

        # Los servicios exponen /internal/* solo para la red interna.
        location ^~ /internal/ { return 404; }

        location = /api/health {
            auth_request off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # --- users-playlists ---
        # Solo register, login, refresh y logout: no exigen sesión.
        location /api/auth/ {
            auth_request off;
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/users/ {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/composer-requests {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/admin/composer-requests {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/admin/users {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/admin/audit {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/playlists {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/favorites {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/follows {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/notices {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/releases {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/tapes {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }

        # --- catalog-streaming ---
        # Audio: sin búferes (el archivo pasa a medida que llega), Range/If-Range reenviados y sin gzip.
        # El stream usa el ticket de streaming (lo valida catálogo): <audio> no envía Authorization.
        location ~ ^/api/songs/[^/]+/stream$ {
            auth_request off;
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            # Un proxy_set_header propio anula los del server: se repiten.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            gzip off;
        }
        location /api/media/ {
            auth_request off;
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            # Un proxy_set_header propio anula los del server: se repiten.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            gzip off;
        }
        # Subidas de MP3 (hasta UPLOAD_MAX_MP3_MB=15) y portadas.
        location /api/composer/ {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
            client_max_body_size 20m;
            proxy_send_timeout 300s;
        }
        location /api/songs {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }
        location /api/artists {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }
        location /api/genres {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }
        location /api/admin/catalog {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }
        location /api/admin/songs {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }

        # --- playback-metrics ---
        location /api/playbacks {
            set $upstream http://playback-metrics:8003;
            proxy_pass $upstream;
        }
        location /api/metrics {
            set $upstream http://playback-metrics:8003;
            proxy_pass $upstream;
        }
        location /api/admin/health {
            set $upstream http://playback-metrics:8003;
            proxy_pass $upstream;
        }
        location /api/admin/reports {
            set $upstream http://playback-metrics:8003;
            proxy_pass $upstream;
        }

        # Una ruta de la API que ningún prefijo anterior reclama es un 404 JSON, no la SPA.
        # Gana el prefijo más largo, así que no afecta a las rutas de arriba.
        location /api/ {
            auth_request off;
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Ruta no encontrada","detail":null}}';
        }

        # Todo lo demás es la SPA.
        location / {
            auth_request off;
            try_files $uri /index.html;
        }
    }
}
