# nginx de entrada de MELOXO: sirve la SPA y reparte /api/* entre los tres servicios por prefijo.
# Se usa la coincidencia más larga; los prefijos que terminan en "/" evitan que /api/composer
# capture /api/composer-requests. Los nombres se resuelven en cada petición con el DNS de Docker:
# nginx arranca aunque un servicio esté caído y lo recupera cuando vuelve.
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        root /usr/share/nginx/html;

        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;

        # Un servicio caído (o sin DNS) responde con el mismo JSON de error que la API.
        error_page 502 503 504 /errors/upstream_unavailable.json;
        location = /errors/upstream_unavailable.json {
            internal;
            alias /etc/nginx/errors/upstream_unavailable.json;
            default_type application/json;
        }

        # Los servicios exponen /internal/* solo para la red interna.
        location ^~ /internal/ { return 404; }

        location = /api/health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # --- users-playlists ---
        location /api/auth/ {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/users/ {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/composer-requests {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/admin/composer-requests {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/admin/users {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/admin/audit {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/playlists {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/favorites {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/follows {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/notices {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/releases {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }
        location /api/tapes {
            set $upstream http://users-playlists:8001;
            proxy_pass $upstream;
        }

        # --- catalog-streaming ---
        # Audio: sin búferes (el archivo pasa a medida que llega), Range/If-Range reenviados y sin gzip.
        location ~ ^/api/songs/[^/]+/stream$ {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            # Un proxy_set_header propio anula los del server: se repiten.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            gzip off;
        }
        location /api/media/ {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            # Un proxy_set_header propio anula los del server: se repiten.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            gzip off;
        }
        # Subidas de MP3 (hasta UPLOAD_MAX_MP3_MB=15) y portadas.
        location /api/composer/ {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
            client_max_body_size 20m;
            proxy_send_timeout 300s;
        }
        location /api/songs {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }
        location /api/artists {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }
        location /api/genres {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }
        location /api/admin/catalog {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }
        location /api/admin/songs {
            set $upstream http://catalog-streaming:8002;
            proxy_pass $upstream;
        }

        # --- playback-metrics ---
        location /api/playbacks {
            set $upstream http://playback-metrics:8003;
            proxy_pass $upstream;
        }
        location /api/metrics {
            set $upstream http://playback-metrics:8003;
            proxy_pass $upstream;
        }
        location /api/admin/health {
            set $upstream http://playback-metrics:8003;
            proxy_pass $upstream;
        }
        location /api/admin/reports {
            set $upstream http://playback-metrics:8003;
            proxy_pass $upstream;
        }

        # Todo lo demás es la SPA.
        location / {
            try_files $uri /index.html;
        }
    }
}
