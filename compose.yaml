name: meloxo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meloxo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meloxo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meloxo -d meloxo"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://meloxo:${POSTGRES_PASSWORD}@postgres:5432/meloxo
    ports:
      - "8080:8080"
    volumes:
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
