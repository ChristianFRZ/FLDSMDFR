name: meloxo

x-runtime: &runtime
  image: ${COMPOSE_PROJECT_NAME:-meloxo}-backend
  pull_policy: never
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=2).close()"]
    interval: 5s
    timeout: 3s
    retries: 20

x-common: &common
  JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
  CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Configura la credencial interna}
  CATALOG_TIMEOUT_SECONDS: ${CATALOG_TIMEOUT_SECONDS:-1.5}
  DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
  APP_VERSION: ${APP_VERSION:-03-gateway-balanceo}

x-users-url: &users-url postgresql+asyncpg://users_playlists:${USERS_DB_PASSWORD:?Configura USERS_DB_PASSWORD}@postgres:5432/users_playlists
x-catalog-url: &catalog-url postgresql+asyncpg://catalog:${CATALOG_DB_PASSWORD:?Configura CATALOG_DB_PASSWORD}@postgres:5432/catalog
x-playback-url: &playback-url postgresql+asyncpg://playbacks:${PLAYBACK_DB_PASSWORD:?Configura PLAYBACK_DB_PASSWORD}@postgres:5432/playbacks
x-catalog-settings: &catalog-settings
  JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
  JAMENDO_API_URL: ${JAMENDO_API_URL:-https://api.jamendo.com/v3.0}
  JAMENDO_AUDIO_MODE: ${JAMENDO_AUDIO_MODE:-proxy}
  COMPOSER_MAX_TRACKS: ${COMPOSER_MAX_TRACKS:-20}
  UPLOAD_MAX_MP3_MB: ${UPLOAD_MAX_MP3_MB:-15}
  UPLOAD_MAX_COVER_MB: ${UPLOAD_MAX_COVER_MB:-2}
  UPLOAD_MAX_MINUTES: ${UPLOAD_MAX_MINUTES:-10}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meloxo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meloxo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meloxo -d meloxo"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-meloxo}-backend
    build: {context: ., target: backend}
    command: ["python", "-m", "app.bootstrap"]
    environment:
      JWT_SECRET: unused
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      PLAYBACK_DB_PASSWORD: ${PLAYBACK_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  users-playlists-service:
    <<: *runtime
    command: ["uvicorn", "app.users_main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *common
      SERVICE_NAME: users
      DATABASE_URL: *users-url
      CATALOG_SERVICE_URL: http://catalog-streaming-service:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TAPE_MAX_TRACKS: ${TAPE_MAX_TRACKS:-12}
      TAPE_MAX_MEMBERS: ${TAPE_MAX_MEMBERS:-8}

  catalog-streaming-service:
    <<: *runtime
    deploy:
      replicas: 2
    command: ["uvicorn", "app.catalog_main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: [*common, *catalog-settings]
      SERVICE_NAME: catalog
      DATABASE_URL: *catalog-url
    volumes:
      - media:/media

  playback-metrics-service:
    <<: *runtime
    command: ["uvicorn", "app.playback_main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *common
      SERVICE_NAME: playback
      DATABASE_URL: *playback-url
      CATALOG_SERVICE_URL: http://catalog-streaming-service:8080

  app:
    restart: always
    build: {context: ., target: entry}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"
    depends_on:
      users-playlists-service: {condition: service_started}
      catalog-streaming-service: {condition: service_started}
      playback-metrics-service: {condition: service_started}

  seed:
    <<: *runtime
    profiles: [tools]
    entrypoint: ["python", "-m", "seed"]
    command: ["all"]
    healthcheck: {disable: true}
    environment:
      <<: [*common, *catalog-settings]
      SERVICE_NAME: maintenance
      DATABASE_URL: *users-url
      USERS_DATABASE_URL: *users-url
      CATALOG_DATABASE_URL: *catalog-url
      PLAYBACK_DATABASE_URL: *playback-url
      CATALOG_SERVICE_URL: http://catalog-streaming-service:8080
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - media:/media

volumes:
  pgdata:
  media:
