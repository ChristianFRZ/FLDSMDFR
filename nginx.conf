js_import gateway from /etc/nginx/gateway.js;
js_shared_dict_zone zone=circuits:128k timeout=1h type=number;
js_set $circuit_blocked gateway.blocked;
js_var $probing;
js_var $circuit_target;
js_var $gateway_failure;

resolver 127.0.0.11 valid=2s ipv6=off;
resolver_timeout 2s;
upstream catalog_pool {
    zone catalog_pool 64k;
    server catalog-streaming-service:8080 resolve max_fails=1 fail_timeout=5s;
}

map $uri $access_policy {
    default session;
    ~^/api/admin(/|$) admin;
    ~^/api/composer(/|$) composer;
    ~^/api/(health|docs|auth/(login|register|refresh|logout))/?$ public;
    ~^/api/media/ public;
    ~^/api/songs/[^/]+/stream/?$ public;
}

map $uri $backend {
    default users-playlists-service:8080;
    ~^/api/(songs|artists|genres|media|composer|admin/catalog|admin/songs)(/|$) catalog_pool;
    ~^/api/playbacks/?$ users-playlists-service:8080;
    ~^/api/(playbacks|metrics|admin/health|admin/reports)(/|$) playback-metrics-service:8080;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 0;  # Catálogo aplica los límites configurables de subida.

    location = /api/openapi.json { try_files /openapi.json =404; }
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    error_page 401 = @unauthenticated;
    error_page 403 = @forbidden;
    error_page 500 502 503 504 = @unavailable;

    location /api/ {
        js_header_filter gateway.observe;
        set $policy $access_policy;
        set $circuit_target $backend;
        if ($circuit_blocked = 1) { return 503; }
        if ($request_method = GET) { rewrite ^ /_gateway_read last; }
        auth_request /_authorize;
        proxy_next_upstream off;
        proxy_pass http://$circuit_target;
    }
    location = /_gateway_read {
        js_header_filter gateway.observe;
        internal;
        auth_request /_authorize;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_pass http://$circuit_target$request_uri;
    }
    location = /_authorize {
        internal;
        if ($policy = public) { return 204; }
        set $users users-playlists-service:8080;
        proxy_pass http://$users/internal/gateway/authorize;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Access-Policy $policy;
    }
    location @unauthenticated {
        default_type application/json;
        return 401 '{"error":{"code":"not_authenticated","message":"Inicia sesión para continuar","detail":null}}';
    }
    location @forbidden {
        default_type application/json;
        return 403 '{"error":{"code":"forbidden","message":"No tienes permiso para esta acción","detail":null}}';
    }
    location @unavailable {
        set $gateway_failure 1;
        js_header_filter gateway.observe;
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable","message":"Servicio no disponible","detail":null}}';
    }
    location /internal/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
