map $uri $backend {
    default users-playlists-service;
    ~^/api/(songs|artists|genres|media|composer|admin/catalog|admin/songs)(/|$) catalog-streaming-service;
    ~^/api/(playbacks|metrics|admin/health|admin/reports)(/|$) playback-metrics-service;
}

server {
    listen 8080;
    resolver 127.0.0.11 valid=2s ipv6=off;
    root /usr/share/nginx/html;
    client_max_body_size 0;  # Catálogo aplica los límites configurables de subida.

    location = /api/openapi.json { try_files /openapi.json =404; }
    location /api/ {
        proxy_pass http://$backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 504 = @unavailable;
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable","message":"Servicio no disponible","detail":null}}';
    }
    location /internal/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
